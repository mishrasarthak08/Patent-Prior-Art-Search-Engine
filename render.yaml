services:
  # 1. FastAPI Backend & In-Process AI Retrieval Engine
  - type: web
    name: patent-search-backend
    env: python
    region: oregon
    plan: starter
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.5
      - key: DATABASE_URL
        fromDatabase:
          name: patent-platform-pg
          property: connectionString
      - key: CONFIDENTIAL_MODE
        value: "true"
      - key: API_KEY
        value: dev_key
      - key: JWT_SECRET_KEY
        generateValue: true

  # 2. Next.js 16 Frontend Web Application
  - type: web
    name: patent-search-frontend
    env: node
    region: oregon
    plan: starter
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start -- -p $PORT
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: patent-search-backend
          property: host
      - key: NEXT_PUBLIC_APP_API_KEY
        value: dev_key

databases:
  # 3. Managed PostgreSQL 16 with Row-Level Security
  - name: patent-platform-pg
    databaseName: patent_platform_pg
    user: patent_app_user
    region: oregon
    plan: starter
