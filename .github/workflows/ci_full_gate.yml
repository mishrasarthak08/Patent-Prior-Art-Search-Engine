name: CI Full Gate

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff black
        pip install -r requirements.txt
        
    - name: Lint with Ruff
      run: |
        ruff check .
        
    - name: Check formatting with Black
      run: |
        black --check .
        
    - name: Check schemas import
      run: |
        python -c "from backend.app import schemas"
