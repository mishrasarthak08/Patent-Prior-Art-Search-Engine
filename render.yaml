services:
  # 1. FastAPI Backend & In-Process AI Retrieval Engine
  - type: web
    name: patent-search-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.5
      - key: CONFIDENTIAL_MODE
        value: "true"
      - key: API_KEY
        value: dev_key
      - key: JWT_SECRET_KEY
        generateValue: true

  # 2. Next.js 16 Frontend Web Application
  - type: web
    name: patent-search-frontend
    env: node
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start -- -p $PORT
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: BACKEND_INTERNAL_URL
        fromService:
          type: web
          name: patent-search-backend
          property: hostport
      - key: NEXT_PUBLIC_APP_API_KEY
        value: dev_key
