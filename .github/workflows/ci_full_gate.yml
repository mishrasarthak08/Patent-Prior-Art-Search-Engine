name: CI Full Gate

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
    - name: Run Ruff
      run: |
        ruff check .
        ruff format --check .
    - name: Run Mypy
      run: |
        mypy backend/app

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
    - name: Run pip-audit
      run: |
        pip-audit || echo "Vulnerabilities found, logging for review."
    - name: Run Gitleaks
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest
    needs: [lint, security]
    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
    - name: Run Pytest
      env:
        GOOGLE_API_KEY: "dummy"
        QDRANT_HOST: "localhost"
        QDRANT_PORT: 6333
        API_KEY: "dev_key"
      run: |
        pytest tests/

  smoke-test:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
    - uses: actions/checkout@v4
    - name: Build and run Docker compose
      run: |
        echo "GOOGLE_API_KEY=dummy" > .env
        echo "API_KEY=dev_key" >> .env
        docker compose build
        docker compose up -d
    - name: Run Smoke Test Script
      run: |
        chmod +x scripts/smoke_test.sh
        ./scripts/smoke_test.sh
    - name: Tear down
      if: always()
      run: docker compose down
